  <style>
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root {
      --header-h: 65px;
      --ink: #14374b;
      --ink-muted: #4a6d78;
      --accent: #087ea3;
      --accent-light: #b5f3ff;
      --glass-background: linear-gradient(130deg,rgba(244,253,255,.60) 0%,rgba(208,237,246,.38) 54%,rgba(169,217,229,.36) 100%);
      --glass-border: rgba(240,253,255,.79);
      --glass-shadow: 0 18px 44px rgba(26,91,116,.17),0 3px 14px rgba(34,93,126,.07);
      --glass-filter: blur(22px) saturate(158%);
    }
    html { min-height: 100%; background: #b7e4ed; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: var(--header-h);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(170deg,#c3ecf6 0%,#8fd2e7 38%,#58b5d0 65%,#f2dfb7 100%);
      overflow-x: hidden;
    }

    /* 屏東墾丁意象：純 CSS 漸層描繪晴空、湛藍海域、近岸淺灘和金色沙地。
       不使用圖片、SVG、多邊形或硬線條，讓畫面保持柔和自然。 */
    .coastal-scenery {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      isolation: isolate;
      background-color: #a8dfec;
      background-image:
        /* 沙灘在畫面下緣柔和漫開，沒有硬切的海岸線 */
        linear-gradient(180deg, transparent 68%, rgba(249,228,182,.08) 79%, rgba(251,229,177,.25) 89%, rgba(249,220,164,.63) 100%),
        /* 日光與天空的淺藍晨霧 */
        radial-gradient(ellipse 77% 52% at 49% -12%, rgba(248,255,255,.91) 0%, rgba(218,247,255,.58) 43%, transparent 95%),
        radial-gradient(ellipse 44% 42% at 11% 10%, rgba(237,255,255,.50) 0%, transparent 91%),
        radial-gradient(ellipse 45% 36% at 106% 10%, rgba(233,251,255,.36) 0%, transparent 87%),
        /* 中層湛藍海水：深淺漸變，沒有水平幾何海平線 */
        radial-gradient(ellipse 88% 50% at 52% 66%, rgba(0,114,170,.71) 0%, rgba(18,155,193,.57) 40%, rgba(92,200,210,.24) 79%, transparent 100%),
        radial-gradient(ellipse 45% 42% at 104% 48%, rgba(4,105,167,.39) 0%, transparent 92%),
        radial-gradient(ellipse 44% 42% at -7% 62%, rgba(35,156,188,.24) 0%, transparent 90%),
        /* 近岸清透的藍綠色浪潮 */
        radial-gradient(ellipse 70% 29% at 47% 90%, rgba(72,195,194,.48) 0%, rgba(112,219,210,.25) 54%, transparent 96%),
        radial-gradient(ellipse 44% 17% at 41% 92%, rgba(234,255,248,.46) 0%, rgba(236,255,245,.13) 44%, transparent 100%),
        /* 溫暖的墾丁沙灘：從畫面底部自然融入海水 */
        radial-gradient(ellipse 108% 46% at 51% 119%, rgba(248,220,163,.97) 0%, rgba(244,219,172,.64) 48%, rgba(249,235,203,.23) 75%, transparent 100%),
        radial-gradient(ellipse 40% 32% at 104% 112%, rgba(254,239,199,.52) 0%, transparent 93%),
        linear-gradient(180deg,#caedf8 0%,#92d6ed 30%,#42a4cd 57%,#62c1ca 78%,#eedbb6 100%);
    }
    /* 玻璃之後的光暈：模糊處理，而非拼接沙丘輪廓 */
    .coastal-scenery::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 46% 27% at 52% 23%, rgba(250,255,255,.35) 0%,transparent 100%),
        radial-gradient(ellipse 85% 20% at 52% 90%, rgba(236,255,248,.22) 0%,transparent 95%),
        linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.00) 65%,rgba(255,244,211,.10));
      filter: blur(18px);
    }

    .glass-panel {
      background: var(--glass-background);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      box-shadow: var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.76),inset 0 -1px 0 rgba(255,255,255,.16);
      backdrop-filter: var(--glass-filter);
      -webkit-backdrop-filter: var(--glass-filter);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .glass-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(123deg,rgba(255,255,255,.30),rgba(255,255,255,.035) 29%,transparent 62%);
      pointer-events: none;
      z-index: -1;
    }
    .glass-panel::after {
      content: "";
      position: absolute;
      left: 23px;
      right: 23px;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg,transparent,rgba(255,255,255,.85) 38%,rgba(255,255,255,.3) 72%,transparent);
      pointer-events: none;
    }

    header {
      position: fixed;

      border-bottom: 1px solid rgba(237,251,255,.37);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12),0 4px 22px rgba(15,58,82,.15);
      backdrop-filter: blur(24px) saturate(154%);

    .nav-container {

    .header-left { justify-content: flex-start; gap: 25px; }
    .header-center { justify-content: center; }
    .header-right { justify-content: flex-end; gap: 25px; }
    .logo { display: flex; text-decoration: none; align-items: center; }
    .logo img { display: block; width: auto; max-height: 45px; max-width: 220px; }

    @media (max-width: 768px) {
      :root { --header-h: 128px; }
      .nav-container { flex-direction: column; justify-content: center; min-height: 128px; gap: 9px; padding: 10px 16px; }
      .header-left { display: none; }
      .header-center,.header-right { flex: none; width: 100%; justify-content: center; }

      .header-right a,.dropdown-btn { font-size: 17px; }

      .logo img { max-height: 45px; }
      main { padding: 16px 16px 8px; }
      .left-column { grid-template-columns: 1fr; grid-template-rows: 106px minmax(0,420px); gap: 14px; }
      .name-card { padding: 12px 18px; }

      .char-table td { padding: 15px 0; font-size: 14.5px; }
      .char-table td:first-child { width: 103px; }
      footer { height: auto; min-height: 56px; padding: 14px 8px 20px; }
      /* iPhone 背景保底：海色仍維持通透，不發生白底合成異常。 */
      .glass-panel { background: linear-gradient(130deg,rgba(237,252,255,.79),rgba(184,226,239,.64)); }

    @media (max-width: 420px) {
      .left-column { grid-template-rows: 100px minmax(0,378px); }

    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }

  <script>
    // 導覽列：開關、點擊外側及 Escape，桌面與手機共用。
    (() => {
      const dropdown = document.querySelector('.dropdown');
      const button = dropdown.querySelector('.dropdown-btn');
      const menu = dropdown.querySelector('.dropdown-content');
      function setOpen(open) {
        menu.classList.toggle('show',open);
        button.setAttribute('aria-expanded',String(open));
      }
      button.addEventListener('click',event=>{
        event.stopPropagation();
        setOpen(!menu.classList.contains('show'));
      });
      document.addEventListener('click',event=>{
        if(!dropdown.contains(event.target)) setOpen(false);
      });
      document.addEventListener('keydown',event=>{
        if(event.key==='Escape') { setOpen(false); button.focus(); }
      });
    })();
  </script>
  <script>
    // 森嶼之聲・湛嶠：湛藍／海水青／泡沫白的五角星粒子拖尾。
    (() => {
      const canvas=document.getElementById('cursor-canvas');
      if(!canvas) return;
      const ctx=canvas.getContext('2d',{alpha:true});
      if(!ctx) return;
      const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
      const colors=['#F4FDFF','#D8F7FF','#9EEBFA','#67D5ED','#38B5E1','#258EC9','#A4F2DC'];
      const particles=[];
      let width=0,height=0,frame=0,lastSpawn=0;
      const maxParticles=200;
      function resize(){
        width=window.innerWidth;
        height=window.innerHeight;
        const dpr=Math.min(window.devicePixelRatio||1,2);
        canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
      }
      window.addEventListener('resize',resize,{passive:true});resize();
      function drawStar(x,y,r,rotation){
        ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.beginPath();
        for(let i=0;i<10;i++){
          const angle=-Math.PI/2+i*Math.PI/5;
          const radius=i%2===0?r:r*.49;
          const px=Math.cos(angle)*radius,py=Math.sin(angle)*radius;
          if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();ctx.fill();ctx.restore();
      }
      function addStar(x,y){
        const angle=Math.random()*Math.PI*2,speed=Math.random()*1.25+.18;
        particles.push({
          x:x+(Math.random()-.5)*13,y:y+(Math.random()-.5)*13,
          vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-.38,
          size:Math.random()*5.8+4.6,color:colors[Math.floor(Math.random()*colors.length)],
          life:0,maxLife:Math.random()*30+36,rotation:Math.random()*Math.PI*2,
          rs:(Math.random()-.5)*.09
        });
        if(particles.length>maxParticles)particles.splice(0,particles.length-maxParticles);
        if(!frame)frame=requestAnimationFrame(animate);
      }
      function leaveTrail(x,y){
        if(document.hidden||reduceMotion.matches)return;
        const now=performance.now();if(now-lastSpawn<12)return;lastSpawn=now;
        addStar(x,y);addStar(x,y);
      }
      window.addEventListener('mousemove',e=>leaveTrail(e.clientX,e.clientY),{passive:true});
      window.addEventListener('touchmove',e=>{if(e.touches.length)leaveTrail(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
      function animate(){
        frame=0;ctx.clearRect(0,0,width,height);
        if(document.hidden||reduceMotion.matches){particles.length=0;return;}
        for(let i=particles.length-1;i>=0;i--){
          const p=particles[i];p.life++;
          if(p.life>=p.maxLife){particles.splice(i,1);continue;}
          p.x+=p.vx;p.y+=p.vy;p.vy+=.042;p.rotation+=p.rs;
          const alpha=1-p.life/p.maxLife;
          ctx.globalAlpha=Math.min(.94,alpha);
          ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=9;
          drawStar(p.x,p.y,p.size,p.rotation);
        }
        ctx.globalAlpha=1;ctx.shadowBlur=0;
        if(particles.length)frame=requestAnimationFrame(animate);
      }
      function reset(){
        if(frame)cancelAnimationFrame(frame);frame=0;
        particles.length=0;ctx.clearRect(0,0,width,height);
      }
      document.addEventListener('visibilitychange',()=>{if(document.hidden)reset();});
      reduceMotion.addEventListener?.('change',()=>{if(reduceMotion.matches)reset();});
    })();
  </script>
</body>
</html>
