<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情報與消息 | 星樂之夢 Star Music Dream</title>
  <meta name="description" content="獲取星樂之夢 Star Music Dream 旗下虛擬歌手的最新情報、聲庫發布與音樂企劃消息。">

  <link rel="icon" href="img/星樂之夢Logo.png" type="image/png">

  <style>
    /* ================= 全域設定與重置 ================= */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* 變數 (Liquid Glass 風格配色) */
    :root {
      --bg-color: #e0f2fe; /* 極淺藍底色 */
      --text-main: #0f172a;
      --text-title: #0f172a;
      --text-muted: #475569;
      --accent-dark: #3b82f6;
      --date-color: #64748b; /* 日期文字顏色，稍微加深以配合亮底 */

      /* Liquid Glass 核心變數 */
      --glass-bg: rgba(255, 255, 255, 0.4); /* 提高透明度 */
      --glass-border: rgba(255, 255, 255, 0.7);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
      --glass-inner: inset 0 2px 4px 0 rgba(255, 255, 255, 0.9), inset 0 -2px 4px 0 rgba(255, 255, 255, 0.2);
      --glass-blur: blur(12px) saturate(160%);
    }

    body {
      margin: 0;
      padding-top: 80px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column; /* 讓 footer 可以黏在底部 */
      background-color: var(--bg-color);
      overflow-x: hidden;
      position: relative;
    }

    /* ================= Liquid Blobs (流動背景色塊) ================= */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      z-index: -1;
      opacity: 0.6;
      animation: float 15s infinite ease-in-out alternate;
    }
    .blob-1 {
      width: 400px; height: 400px;
      background: #93c5fd; /* 淺藍 */
      top: -100px; left: -100px;
    }
    .blob-2 {
      width: 500px; height: 500px;
      background: #fbcfe8; /* 淺粉 */
      bottom: -150px; right: -100px;
      animation-delay: -5s;
    }
    .blob-3 {
      width: 350px; height: 350px;
      background: #fde047; /* 淺黃 */
      top: 40%; left: 30%;
      animation-delay: -10s;
      animation-duration: 20s;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* 滑鼠星星粒子畫布樣式 */
    #cursor-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none !important; z-index: 90;
    }

    /* ================= 頂部導覽列 (Liquid Glass) ================= */
    header {
      padding: 10px 0;
      display: flex;
      justify-content: center;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      padding: 0 20px;
    }

    .header-left, .header-center, .header-right {
      display: flex; align-items: center; flex: 1;
    }
    .header-left { justify-content: flex-start; gap: 20px; }
    .header-center { justify-content: center; }
    .header-right { justify-content: flex-end; gap: 20px; }

    .logo { text-decoration: none; display: flex; align-items: center; z-index: 1001; position: relative;}
    .logo-image { max-height: 45px; width: auto; display: block; border-radius: 4px; }

    .nav-links a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      transition: color 0.3s;
      cursor: pointer;
    }
    .nav-links a:hover { color: var(--accent-dark); }
    .nav-links a.active { color: var(--accent-dark); border-bottom: 2px solid var(--accent-dark); padding-bottom: 2px;}

    /* 漢堡選單按鈕 (電腦版隱藏) */
    .menu-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      z-index: 1001; /* 確保在展開選單的最上層 */
      position: relative;
    }
    .menu-btn svg {
      width: 32px;
      height: 32px;
      stroke: var(--text-main);
      transition: stroke 0.3s;
    }
    .menu-btn:hover svg { stroke: var(--accent-dark); }

    /* ================= 手機版全螢幕選單 (Mobile Overlay) ================= */
    .mobile-menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .mobile-menu-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-nav-links {
      display: flex;
      flex-direction: column;
      gap: 30px;
      text-align: center;
    }

    .mobile-nav-links a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      transition: color 0.3s;
    }
    .mobile-nav-links a:hover, .mobile-nav-links a.active {
      color: var(--accent-dark);
    }

    /* ================= 通用區塊設定 ================= */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1; /* 佔滿剩餘空間，把 footer 擠下去 */
      position: relative;
      z-index: 1; /* 確保在 Blob 之上 */
    }

    /* 頁面大標題 (Liquid Glass 風格) */
    .page-hero {
      text-align: center;
      margin-top: 60px;
      margin-bottom: 60px;
      width: 100%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px 20px;
      box-shadow: var(--glass-shadow), var(--glass-inner);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      position: relative;
      overflow: hidden; /* 防止內部元素超出圓角 */
    }

    /* 玻璃卡片反光 */
    .page-hero::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-20deg);
      animation: shine 8s infinite;
      pointer-events: none;
    }
    @keyframes shine {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }

    .page-hero h1 {
      margin: 0 0 15px 0;
      color: var(--accent-dark);
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 2px 5px rgba(255,255,255,1);
    }
    .page-hero p {
      margin: 0;
      color: var(--text-main);
      font-size: 16px;
      line-height: 1.8;
      font-weight: 600;
    }

    /* ================= 情報與消息 預留區塊 (Empty State Liquid Glass版) ================= */
    .empty-state-panel {
      width: 100%;
      padding: 80px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--glass-bg);
      border: 2px dashed rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      box-shadow: var(--glass-shadow), var(--glass-inner);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      margin-bottom: 80px;
    }
    .empty-state-panel svg {
      width: 50px;
      height: 50px;
      color: var(--accent-dark);
      margin-bottom: 20px;
      opacity: 0.8;
    }
    .empty-state-panel h2 {
      color: var(--text-main);
      font-size: 22px;
      margin: 0 0 10px 0;
      text-shadow: 0 1px 2px rgba(255,255,255,0.8);
    }
    .empty-state-panel p {
      color: var(--text-muted);
      font-size: 16px;
      margin: 0;
      font-weight: 500;
    }

    /* 未來有新聞時使用的 Grid (先隱藏保留樣式) */
    .news-grid {
      display: none; /* 目前隱藏 */
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
      width: 100%;
      margin-bottom: 80px;
    }
    .news-card {
      background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; overflow: hidden; text-decoration: none; box-shadow: var(--glass-shadow), var(--glass-inner); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column;
    }
    .news-card:hover {
      transform: translateY(-8px); box-shadow: 0 15px 40px rgba(31, 38, 135, 0.15), var(--glass-inner); border-color: rgba(255, 255, 255, 1);
    }
    .news-img-box {
      width: 100%; aspect-ratio: 16 / 9; background: rgba(255,255,255,0.3); overflow: hidden; position: relative;
    }
    .news-img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .news-card:hover .news-img-box img { transform: scale(1.05); }
    .news-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; background: rgba(255,255,255,0.4); border-top: 1px solid rgba(255,255,255,0.5); }
    .news-date { color: var(--date-color); font-size: 13px; font-weight: bold; margin-bottom: 10px; letter-spacing: 0.5px; }
    .news-title { margin: 0 0 10px 0; color: var(--text-title); font-size: 18px; font-weight: 800; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 2px rgba(255,255,255,0.8);}
    .news-desc { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 500;}

    /* ================= 頁尾 ================= */
    footer {
      text-align: center; padding: 30px; color: var(--text-muted); font-size: 14px;
      background: rgba(255, 255, 255, 0.3); border-top: 1px solid rgba(255,255,255,0.5);
      width: 100%;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      margin-top: auto; /* 確保內容不夠時 footer 在最下面 */
      position: relative;
      z-index: 1;
    }

    /* ================= 回到頂部按鈕 ================= */
    #scrollToTopBtn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1), var(--glass-inner);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      color: var(--accent-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 999;
      opacity: 0; /* 預設隱藏，靠 JS 判斷滾動距離顯示 */
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #scrollToTopBtn.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    #scrollToTopBtn:hover {
      background: rgba(255, 255, 255, 0.95);
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(31, 38, 135, 0.15), var(--glass-inner);
    }

    #scrollToTopBtn svg {
      width: 24px;
      height: 24px;
    }

    /* ================= RWD 響應式 ================= */
    @media (max-width: 768px) {
      /* 導覽列：手機版 Logo 至左，漢堡選單至右 */
      header { padding: 10px 0; background: rgba(255, 255, 255, 0.6); }
      .nav-container {
        flex-direction: row; /* 強制左右排列 */
        justify-content: space-between;
        padding: 10px 25px;
      }

      /* 隱藏電腦版的文字連結區塊 */
      .header-left, .header-right { display: none; }

      /* Logo 改為靠左 */
      .header-center { flex: unset; justify-content: flex-start; }

      /* 顯示漢堡選單按鈕 */
      .menu-btn { display: block; }

      .page-hero { padding: 30px 15px; }
      .page-hero h1 { font-size: 28px; }

      .blob-1 { width: 300px; height: 300px; }
      .blob-2 { width: 350px; height: 350px; }
      .blob-3 { width: 250px; height: 250px; }

      /* 手機版回到頂部按鈕調整 */
      #scrollToTopBtn {
        bottom: 20px;
        right: 20px;
        width: 45px;
        height: 45px;
      }
    }
  </style>

  <!-- 手機版選單切換腳本 -->
  <script>
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
    let isMenuOpen = false;

    mobileMenuBtn.addEventListener('click', () => {
      isMenuOpen = !isMenuOpen;
      if(isMenuOpen) {
        mobileMenuOverlay.classList.add('active');
        document.body.style.overflow = 'hidden'; // 鎖定背景滾動
        // 替換圖示為 'X' (關閉)
        mobileMenuBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
      } else {
        mobileMenuOverlay.classList.remove('active');
        document.body.style.overflow = 'auto'; // 恢復背景滾動
        // 替換回漢堡選單 (三條線)
        mobileMenuBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>';
      }
    });

    // 點擊選單內的連結後自動關閉選單
    document.querySelectorAll('.mobile-nav-links a').forEach(link => {
      link.addEventListener('click', () => {
        if(isMenuOpen) {
          mobileMenuBtn.click(); // 模擬點擊按鈕來關閉
        }
      });
    });
  </script>

  <!-- 滑鼠星星粒子特效 -->
  <script>
    (function(){
      const canvas = document.getElementById('cursor-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      const DPR = window.devicePixelRatio || 1;

      function resize(){
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * DPR;
        canvas.height = height * DPR;
        ctx.scale(DPR, DPR);
      }
      window.addEventListener('resize', resize); resize();

      const palette = ['#9bc8fb', '#FB9D9E', '#C7EEFB', '#FCC89B'];
      const particles = [];

      function drawStar(ctx, x, y, radius, rot) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
        const spikes = 5; const outerRadius = radius; const innerRadius = radius * 0.5;
        let angle = Math.PI / 2 * 3; let step = Math.PI / spikes;
        ctx.moveTo(0, -outerRadius);
        for (let i = 0; i < spikes; i++) {
          ctx.lineTo(Math.cos(angle) * outerRadius, Math.sin(angle) * outerRadius);
          angle += step;
          ctx.lineTo(Math.cos(angle) * innerRadius, Math.sin(angle) * innerRadius);
          angle += step;
        }
        ctx.lineTo(0, -outerRadius); ctx.closePath(); ctx.fill(); ctx.restore();
      }

      function addParticle(x, y) {
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(Math.random() * Math.PI * 2) * (Math.random() * 1.5),
          vy: Math.sin(Math.random() * Math.PI * 2) * (Math.random() * 1.5) - 0.5,
          size: Math.random() * 8 + 6,
          color: palette[Math.floor(Math.random() * palette.length)],
          alpha: 0.8,
          life: 0,
          maxLife: Math.random() * 40 + 40,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.1
        });
      }

      window.addEventListener('mousemove', (e) => {
        for(let i=0; i<2; i++) {
          addParticle(e.clientX + (Math.random()-0.5)*10, e.clientY + (Math.random()-0.5)*10);
        }
      }, {passive: true});

      function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i]; p.life++;
          if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
          p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.rotSpeed; p.alpha = 0.8 * (1 - p.life / p.maxLife);
          ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha; ctx.shadowBlur = 10; ctx.shadowColor = p.color;
          drawStar(ctx, p.x, p.y, p.size, p.rot);
        }
        ctx.shadowBlur = 0; ctx.globalAlpha = 1; requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>

  <!-- 回到頂部按鈕邏輯 -->
  <script>
    const scrollToTopBtn = document.getElementById("scrollToTopBtn");

    // 監聽滾動事件
    window.addEventListener("scroll", () => {
      // 當頁面向下滾動超過 300px 時顯示按鈕
      if (window.scrollY > 300) {
        scrollToTopBtn.classList.add("show");
      } else {
        scrollToTopBtn.classList.remove("show");
      }
    });

    // 點擊返回頂部（平滑滾動）
    scrollToTopBtn.addEventListener("click", () => {
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    });
  </script>
</body>
