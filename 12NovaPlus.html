<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>12Nova+ | 專屬人聲混音效果器</title>
  <meta name="description" content="12Nova+ 是星樂之夢打造的專屬專業人聲混音效果器 (VST Plugin)，帶來前所未有的聲音處理體驗。">

  <!-- 請確保您有這張 12Nova+ 的 Logo 圖示 -->
  <link rel="icon" href="img/12NovaPlus_Logo.png" type="image/png" onerror="this.href='img/星樂之夢Logo.png'">

  <style>
    /* ================= 全域設定與重置 ================= */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    /* 變數 (12Nova+ 專屬：未來科技、純白與冰藍色) */
    :root {
      --bg: #f4f9ff; /* 極淺冰藍底色 */
      --text-main: #1e293b;
      --text-muted: #64748b;
      --accent-main: #0ea5e9; /* 冰藍色 (Ice Blue) */
      --accent-hover: #0284c7;

      /* 星樂之夢標準導覽列需要用到這個變數 */
      --accent-dark: #63a4ff;

      /* 霧面玻璃卡片變數 (偏白、清透) */
      --card-bg: rgba(255, 255, 255, 0.7);
      --card-border: rgba(255, 255, 255, 1);
      --card-shadow: 0 10px 40px rgba(14, 165, 233, 0.1);
      --card-shadow-hover: 0 15px 50px rgba(14, 165, 233, 0.2);
      --glass-blur: blur(20px) saturate(150%);
    }

    body {
      margin: 0;
      padding-top: 80px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      background: var(--bg);
      overflow-x: hidden;
    }

    /* 背景裝飾：光暈效果 */
    .bg-glow {
      position: fixed;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }
    .bg-glow-2 {
      position: fixed;
      bottom: -10%;
      right: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      z-index: -1;
      pointer-events: none;
    }

    /* 滑鼠星星粒子畫布樣式 */
    #cursor-canvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none !important; z-index: 90;
    }

    /* ================= 頂部導覽列 (星樂之夢標準版) ================= */
    header {
      padding: 10px 0;
      display: flex;
      justify-content: center;
      background: rgba(255, 255, 255, 0.4);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .nav-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 1100px;
      padding: 0 20px;
    }

    .header-left, .header-center, .header-right {
      display: flex; align-items: center; flex: 1;
    }
    .header-left { justify-content: flex-start; gap: 20px; }
    .header-center { justify-content: center; }
    .header-right { justify-content: flex-end; gap: 20px; }

    .logo { text-decoration: none; display: flex; align-items: center; z-index: 1001; position: relative;}
    .logo-image { max-height: 45px; width: auto; display: block; border-radius: 4px; }

    .nav-links a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      transition: color 0.3s;
      cursor: pointer;
    }
    .nav-links a:hover { color: var(--accent-main); } /* 配合 12Nova+ 改為冰藍色 hover */

    /* 漢堡選單按鈕 (電腦版隱藏) */
    .menu-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 5px;
      z-index: 1001; /* 確保在展開選單的最上層 */
      position: relative;
    }
    .menu-btn svg {
      width: 32px;
      height: 32px;
      stroke: var(--text-main);
      transition: stroke 0.3s;
    }
    .menu-btn:hover svg { stroke: var(--accent-main); }

    /* ================= 手機版全螢幕選單 (Mobile Overlay) ================= */
    .mobile-menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .mobile-menu-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-nav-links {
      display: flex;
      flex-direction: column;
      gap: 30px;
      text-align: center;
    }

    .mobile-nav-links a {
      color: var(--text-main);
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      transition: color 0.3s;
    }
    .mobile-nav-links a:hover {
      color: var(--accent-main);
    }

    /* ================= 通用區塊與卡片 ================= */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 30px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    section { width: 100%; margin-bottom: 80px; }

    .glass-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: var(--card-shadow);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: 40px;
    }

    /* ================= 首頁 Hero 區塊 ================= */
    .hero-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      margin-top: 60px;
      padding: 60px 40px;
    }

    .hero-text {
      flex: 1;
    }

    .hero-text h1 {
      font-size: 48px;
      font-weight: 900;
      color: var(--text-main);
      margin: 0 0 15px 0;
      line-height: 1.2;
    }
    .hero-text h1 span {
      color: var(--accent-main);
    }
    .hero-text p {
      font-size: 18px;
      color: var(--text-muted);
      margin: 0 0 30px 0;
      line-height: 1.6;
      max-width: 500px;
    }

    .btn-primary {
      display: inline-block;
      background: var(--accent-main);
      color: #fff;
      padding: 14px 36px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.4);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(14, 165, 233, 0.5);
    }

    /* 軟體截圖展示 */
    .hero-image {
      flex: 1.2;
      display: flex;
      justify-content: center;
      position: relative;
    }
    .hero-image img {
      width: 100%;
      max-width: 600px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transform: perspective(1000px) rotateY(-5deg);
      transition: transform 0.5s ease;
    }
    .hero-image img:hover {
      transform: perspective(1000px) rotateY(0deg) scale(1.02);
    }

    /* ================= 特色功能區塊 (Features) ================= */
    .features-section {
      text-align: center;
    }
    .section-title {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 50px;
      color: var(--text-main);
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }

    .feature-card {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 35px 25px;
      text-align: left;
      transition: all 0.3s ease;
    }
    .feature-card:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: translateY(-5px);
      box-shadow: var(--card-shadow-hover);
    }

    .feature-icon {
      width: 50px;
      height: 50px;
      background: rgba(14, 165, 233, 0.1);
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }
    .feature-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--accent-main);
      stroke-width: 2;
      fill: none;
    }

    .feature-card h3 {
      font-size: 20px;
      margin: 0 0 10px 0;
      color: var(--text-main);
    }
    .feature-card p {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 0;
    }

    /* ================= 系統需求與下載 ================= */
    .download-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 60px 40px;
    }
    .download-section h2 {
      margin-top: 0;
      font-size: 32px;
      color: var(--text-main);
    }
    .specs-box {
      display: inline-flex;
      gap: 30px;
      background: rgba(255,255,255,0.6);
      padding: 20px 40px;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      margin-bottom: 30px;
    }
    .spec-item {
      text-align: left;
    }
    .spec-item span {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }
    .spec-item strong {
      font-size: 16px;
      color: var(--text-main);
    }

    /* ================= 回到頂部按鈕 ================= */
    .back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: rgba(14, 165, 233, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(14, 165, 233, 0.5);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 999;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .back-to-top.show { opacity: 1; visibility: visible; }
    .back-to-top:hover { background: var(--accent-main); transform: translateY(-5px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4); }
    .back-to-top svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ================= 8. 頁尾 ================= */
    footer {
      text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px;
      border-top: 1px solid rgba(0,0,0,0.05);
      width: 100%;
    }

    /* ================= RWD 響應式 ================= */
    @media (max-width: 900px) {
      .hero-section { flex-direction: column; text-align: center; padding: 40px 20px; }
      .hero-text p { margin: 0 auto 30px auto; }
      .hero-image img { transform: none; max-width: 100%; }
      .hero-image img:hover { transform: scale(1.02); }
      .feature-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      /* 導覽列：手機版 Logo 至左，漢堡選單至右 */
      header { padding: 10px 0; background: rgba(255, 255, 255, 0.8); }
      .nav-container {
        flex-direction: row; /* 強制左右排列 */
        justify-content: space-between;
        padding: 10px 25px;
      }

      /* 隱藏電腦版的文字連結區塊 */
      .header-left, .header-right { display: none; }

      /* Logo 改為靠左 */
      .header-center { flex: unset; justify-content: flex-start; }

      /* 顯示漢堡選單按鈕 */
      .menu-btn { display: block; }

      body { padding-top: 100px; }
      .hero-text h1 { font-size: 36px; }

      .specs-box { flex-direction: column; gap: 15px; padding: 20px; align-items: center; text-align: center; }
      .spec-item { text-align: center; }

      .back-to-top { bottom: 20px; right: 20px; width: 40px; height: 40px; }
      .back-to-top svg { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>
  <!-- 背景光暈 -->
  <div class="bg-glow"></div>
  <div class="bg-glow-2"></div>

  <canvas id="cursor-canvas"></canvas>

  <header>
    <div class="nav-container">
      <!-- 電腦版：左側連結 -->
      <div class="header-left nav-links">
        <a href="vsinger.html">歌手資訊</a>
        <a href="news.html">情報與消息</a>
      </div>

      <!-- Logo (電腦版置中，手機版靠左) -->
      <div class="header-center">
        <a href="index.html" class="logo">
          <img src="img/星樂之夢Logo(橫).png" alt="星樂之夢 Logo" class="logo-image">
        </a>
      </div>

      <!-- 電腦版：右側連結 -->
      <div class="header-right nav-links">
        <a href="about.html">關於我們</a>
        <a href="history.html">歷史概要</a>
      </div>

      <!-- 手機版：漢堡選單按鈕 (電腦版隱藏) -->
      <button class="menu-btn" id="mobileMenuBtn" aria-label="打開選單">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <!-- 預設顯示三條線 -->
          <line x1="3" y1="12" x2="21" y2="12" class="line-mid"></line>
          <line x1="3" y1="6" x2="21" y2="6" class="line-top"></line>
          <line x1="3" y1="18" x2="21" y2="18" class="line-bot"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- 手機版：全螢幕展開選單 -->
  <div class="mobile-menu-overlay" id="mobileMenuOverlay">
    <div class="mobile-nav-links">
      <a href="vsinger.html">歌手資訊</a>
      <a href="news.html">情報與消息</a>
      <a href="about.html">關於我們</a>
      <a href="history.html">歷史概要</a>
    </div>
  </div>

  <main>
    <!-- Hero 介紹區塊 -->
    <section class="hero-section glass-panel">
      <div class="hero-text">
        <h1>次世代人聲處理<br><span>12Nova Vocal+</span></h1>
        <p>為星樂之夢 (Star Music Dream) 工作室量身打造的音訊 VST 外掛。結合冰藍介面、直覺的旋鈕，讓虛擬歌手的聲音處理變得簡單與純粹。</p>
        <a href="#download" class="btn-primary">探索更多 / 準備下載</a>
      </div>
      <div class="hero-image">
        <!-- 放置 12Nova+ 的 UI 介面截圖 (參考截圖 2026-09-23 10.26.29.jpg) -->
        <img src="img/12NovaPlus_UI.png" alt="12Nova+ 軟體介面" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'600\' height=\'350\'><rect fill=\'%23e0f2fe\' width=\'100%\' height=\'100%\' rx=\'16\'/><text x=\'50%\' y=\'50%\' fill=\'%230284c7\' font-family=\'sans-serif\' font-size=\'20\' font-weight=\'bold\' text-anchor=\'middle\' alignment-baseline=\'middle\'>12Nova+ UI 介面圖預留位置</text></svg>'">
      </div>
    </section>

    <!-- 系統需求與下載區塊 -->
    <section id="download" class="download-section glass-panel">
      <h2>取得 12Nova Vocal+</h2>
      <p style="color: var(--text-muted); margin-bottom: 30px;">專為虛擬歌手量身打造的人聲處理外掛，現已開放下載 V1.0 版本。</p>

      <div class="specs-box">
        <div class="spec-item">
          <span>目前版本</span>
          <strong>1.0</strong>
        </div>
        <div class="spec-item">
          <span>支援格式</span>
          <strong>VST3 / AU</strong>
        </div>
        <div class="spec-item">
          <span>開發核心</span>
          <strong>C++ (JUCE Framework)</strong>
        </div>
      </div>

      <a href="#" class="btn-primary">下載 V1.0 正式版</a>
    </section>

  </main>

  <!-- 回到頂部按鈕 -->
  <div class="back-to-top" id="backToTopBtn" aria-label="回到頂部">
    <svg viewBox="0 0 24 24">
      <path d="M18 15l-6-6-6 6"/>
    </svg>
  </div>

  <footer>
    <p>© 2026 Star Music Dream</p>
  </footer>

  <script>
    // 手機版選單切換腳本
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenuOverlay = document.getElementById('mobileMenuOverlay');
    let isMenuOpen = false;

    if(mobileMenuBtn) {
        mobileMenuBtn.addEventListener('click', () => {
          isMenuOpen = !isMenuOpen;
          if(isMenuOpen) {
            mobileMenuOverlay.classList.add('active');
            document.body.style.overflow = 'hidden'; // 鎖定背景滾動
            // 替換圖示為 'X' (關閉)
            mobileMenuBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
          } else {
            mobileMenuOverlay.classList.remove('active');
            document.body.style.overflow = 'auto'; // 恢復背景滾動
            // 替換回漢堡選單 (三條線)
            mobileMenuBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>';
          }
        });

        // 點擊選單內的連結後自動關閉選單
        document.querySelectorAll('.mobile-nav-links a').forEach(link => {
          link.addEventListener('click', () => {
            if(isMenuOpen) {
              mobileMenuBtn.click(); // 模擬點擊按鈕來關閉
            }
          });
        });
    }

    // 回到頂部按鈕邏輯
    const backToTopBtn = document.getElementById('backToTopBtn');
    if(backToTopBtn) {
        window.addEventListener('scroll', () => {
          if (window.scrollY > 300) {
            backToTopBtn.classList.add('show');
          } else {
            backToTopBtn.classList.remove('show');
          }
        });

        backToTopBtn.addEventListener('click', () => {
          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });
        });
    }

    // 滑鼠星星粒子特效 (冰藍色系)
    (function(){
      const canvas = document.getElementById('cursor-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width, height;
      const DPR = window.devicePixelRatio || 1;

      function resize(){
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * DPR;
        canvas.height = height * DPR;
        ctx.scale(DPR, DPR);
      }
      window.addEventListener('resize', resize);
      resize();

      // 12Nova+ 專屬冰藍配色
      const palette = ['#0ea5e9', '#38bdf8', '#7dd3fc', '#bae6fd', '#e0f2fe'];
      const particles = [];

      function drawStar(ctx, x, y, radius, rot) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rot);
        ctx.beginPath();
        const spikes = 5;
        const outerRadius = radius;
        const innerRadius = radius * 0.5;
        let angle = Math.PI / 2 * 3;
        let step = Math.PI / spikes;

        ctx.moveTo(0, -outerRadius);
        for (let i = 0; i < spikes; i++) {
          ctx.lineTo(Math.cos(angle) * outerRadius, Math.sin(angle) * outerRadius);
          angle += step;
          ctx.lineTo(Math.cos(angle) * innerRadius, Math.sin(angle) * innerRadius);
          angle += step;
        }
        ctx.lineTo(0, -outerRadius);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function addParticle(x, y) {
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(Math.random() * Math.PI * 2) * (Math.random() * 1.5),
          vy: Math.sin(Math.random() * Math.PI * 2) * (Math.random() * 1.5) - 0.5,
          size: Math.random() * 6 + 4, // 稍微調小一點，更精緻
          color: palette[Math.floor(Math.random() * palette.length)],
          alpha: 0.8,
          life: 0,
          maxLife: Math.random() * 30 + 30,
          rot: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - 0.5) * 0.1
        });
      }

      // 電腦滑鼠移動
      window.addEventListener('mousemove', (e) => {
        for(let i=0; i<2; i++) {
            addParticle(e.clientX + (Math.random()-0.5)*10, e.clientY + (Math.random()-0.5)*10);
        }
      }, {passive: true});

      // 手機觸控移動
      window.addEventListener('touchmove', (e) => {
        if(e.touches.length > 0) {
            for(let i=0; i<2; i++) {
                addParticle(e.touches[0].clientX + (Math.random()-0.5)*10, e.touches[0].clientY + (Math.random()-0.5)*10);
            }
        }
      }, {passive: true});

      function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life++;

          if (p.life >= p.maxLife) {
              particles.splice(i, 1);
              continue;
          }

          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.05;
          p.rot += p.rotSpeed;
          p.alpha = 0.8 * (1 - p.life / p.maxLife);

          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.shadowBlur = 15;
          ctx.shadowColor = p.color;

          drawStar(ctx, p.x, p.y, p.size, p.rot);
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>
</body>
</html>
