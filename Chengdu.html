    *, *::before, *::after { box-sizing: border-box; }

    :root {

      --glass-inner: inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(154,255,184,.17), inset 1px 0 0 rgba(255,255,255,.11);

    html { min-height: 100%; background: var(--bg-start); }

      padding-top: var(--header-h);

      min-height: 100dvh;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      color: var(--text-main);
      background: var(--bg-start);
      overflow-x: hidden;
      position: relative;
    }
    /* iPhone / Safari 安全背景層：不依賴 background-attachment: fixed 與負 z-index。 */
    .page-backdrop {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: linear-gradient(128deg, var(--bg-start) 0%, #064B21 25%, var(--bg-mid) 54%, var(--bg-end) 100%);
      isolation: isolate;
    }
    .page-backdrop .blob {
      position: absolute;
      z-index: 1;
    }
    /* 內容永遠位在漸層之上，保留背景模糊可取樣的深色色彩。 */
    main, footer { position: relative; z-index: 1; }
    .page-backdrop::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(ellipse at 12% 70%, rgba(27,199,102,.18), transparent 48%),
                  radial-gradient(ellipse at 82% 12%, rgba(112,255,167,.12), transparent 45%);
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .20;
      z-index: -1;
      pointer-events: none;
      animation: float 19s infinite ease-in-out alternate;
    }
    .blob-1 { width: 430px; height: 430px; background: #16A34A; top: -140px; left: -100px; }
    .blob-2 { width: 520px; height: 520px; background: #34D399; right: -160px; bottom: -170px; animation-delay: -6s; }
    .blob-3 { width: 340px; height: 340px; background: #86EFAC; left: 26%; top: 32%; animation-delay: -11s; }
    @keyframes float {
      0% { transform: translate(0,0) scale(1); }
      50% { transform: translate(22px,-32px) scale(1.08); }
      100% { transform: translate(-18px,20px) scale(.95); }
    }

    /* 透明墨綠玻璃與細緻高光，背後綠色可透過卡片呈現 */
    .glass-panel {
      position: relative;
      isolation: isolate;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--glass-shadow), var(--glass-inner);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      overflow: hidden;
    }
    .glass-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(125deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.022) 26%, transparent 52%);
      pointer-events: none;
      z-index: -1;
    }
    .glass-panel::after {
      content: '';
      position: absolute;
      left: 22px;
      right: 22px;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.64) 35%, rgba(255,255,255,.28) 70%, transparent);

  <script>
    function toggleDropdown(event, element) {
      event.stopPropagation();
      document.querySelectorAll('.dropdown-content').forEach(d => {
        if (d !== element.querySelector('.dropdown-content')) d.classList.remove('show');
      });
      const target = element.querySelector('.dropdown-content');
      if (target) {
        target.classList.toggle('show');
        const trigger = element.querySelector('.dropdown-btn');
        trigger?.setAttribute('aria-expanded', String(target.classList.contains('show')));
      }
    }

    window.addEventListener('click', function(event) {
      if (!event.target.closest('.dropdown')) {
        document.querySelectorAll('.dropdown-content').forEach(d => {
          d.classList.remove('show');
          d.closest('.dropdown')?.querySelector('.dropdown-btn')?.setAttribute('aria-expanded', 'false');
        });
      }
    });

  </script>

  <!-- 滑鼠星星粒子：與既有官網一致的五星造型，程都限定翡翠／薄荷配色 -->
  <script>
    (() => {
      const canvas = document.getElementById('cursor-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d', { alpha: true });
      if (!ctx) return;

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const palette = [
        '#F0FFF5', // 晨霧白綠
        '#D2FFE5', // 薄荷綠
        '#A8FACC', // 嫩葉綠
        '#76E9A3', // 翠綠色
        '#3DCF7A', // 碧綠
        '#16A34A'  // 深綠星光
      ];
      const particles = [];
      const maxParticles = 220;
      let width = 0;
      let height = 0;
      let frameId = 0;
      let lastSpawn = 0;

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
      }
      window.addEventListener('resize', resizeCanvas, { passive: true });
      resizeCanvas();

      // 維持星希羽官網的五角星形狀與隨機旋轉、下墜和淡出動態。
      function drawStar(x, y, radius, rotation) {
        const spikes = 5;
        const step = Math.PI / spikes;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        ctx.beginPath();
        for (let i = 0; i < spikes * 2; i++) {
          const angle = -Math.PI / 2 + i * step;
          const r = i % 2 === 0 ? radius : radius * 0.48;
          const px = Math.cos(angle) * r;
          const py = Math.sin(angle) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function addStar(x, y) {
        const direction = Math.random() * Math.PI * 2;
        const speed = Math.random() * 1.35 + .15;
        particles.push({
          x: x + (Math.random() - .5) * 14,
          y: y + (Math.random() - .5) * 14,
          vx: Math.cos(direction) * speed,
          vy: Math.sin(direction) * speed - .45,
          size: Math.random() * 6.5 + 4.5,
          color: palette[Math.floor(Math.random() * palette.length)],
          life: 0,
          maxLife: Math.random() * 30 + 38,
          rotation: Math.random() * Math.PI * 2,
          rotSpeed: (Math.random() - .5) * .095
        });
        if (particles.length > maxParticles) particles.splice(0, particles.length - maxParticles);
        if (!frameId) frameId = requestAnimationFrame(animate);
      }

      function leaveTrail(x, y) {
        if (reducedMotion.matches || document.hidden) return;
        // 降低高更新率滑鼠的粒子量，仍保留移動時連續的星星拖尾。
        const now = performance.now();
        if (now - lastSpawn < 10) return;
        lastSpawn = now;
        addStar(x, y);
        addStar(x, y);
      }

      window.addEventListener('mousemove', (event) => {
        leaveTrail(event.clientX, event.clientY);
      }, { passive: true });

      window.addEventListener('touchmove', (event) => {
        if (event.touches.length) {
          leaveTrail(event.touches[0].clientX, event.touches[0].clientY);
        }
      }, { passive: true });

      function animate() {
        frameId = 0;
        ctx.clearRect(0, 0, width, height);
        if (document.hidden || reducedMotion.matches) {
          particles.length = 0;
          return;
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const star = particles[i];
          star.life++;
          if (star.life >= star.maxLife) {
            particles.splice(i, 1);
            continue;
          }
          star.x += star.vx;
          star.y += star.vy;
          star.vy += .045;
          star.rotation += star.rotSpeed;
          const t = 1 - star.life / star.maxLife;
          ctx.globalAlpha = Math.min(1, t * 1.03);
          ctx.fillStyle = star.color;
          ctx.shadowColor = star.color;
          ctx.shadowBlur = 10;
          drawStar(star.x, star.y, star.size, star.rotation);
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        if (particles.length) frameId = requestAnimationFrame(animate);
      }

      // 切換分頁時不讓粒子在背景持續運算。
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (frameId) cancelAnimationFrame(frameId);
          frameId = 0;
          particles.length = 0;
          ctx.clearRect(0, 0, width, height);
        }
      });
      reducedMotion.addEventListener?.('change', () => {
        if (!reducedMotion.matches) return;
        if (frameId) cancelAnimationFrame(frameId);
        frameId = 0;
        particles.length = 0;
        ctx.clearRect(0, 0, width, height);
      });
    })();
  </script>
</body>
</html>
