<html lang="zh-Hant">

  <link rel="icon" href="img/森嶼之聲Logo.png" type="image/png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :root {
      --header-h: 65px;
      --ink: #263e36;
      --ink-muted: #537469;
      --accent: #36885e;
      --accent-light: #E5FBA1;
      --glass-background: linear-gradient(130deg,rgba(245,253,248,.60) 0%,rgba(207,237,222,.38) 54%,rgba(173,221,195,.36) 100%);
      --glass-border: rgba(245,255,247,.79);
      --glass-shadow: 0 18px 44px rgba(27,82,62,.17),0 3px 14px rgba(34,87,66,.07);
      --glass-filter: blur(22px) saturate(158%);
    }
    html { min-height: 100%; background: #accbc1; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding-top: var(--header-h);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(180deg,#bdd4dd 0%,#dcece8 33%,#bedad1 68%,#86b4a9 100%);
      overflow-x: hidden;
    }

    /* 太魯閣的灰藍峽谷、植被與碧綠溪流：純 CSS 柔和色彩漸層。 */
    .valley-scenery {
      position: fixed;
      inset: 0;
      z-index: 0;
      isolation: isolate;
      pointer-events: none;
      overflow: hidden;
      background:
        /* 兩側岩壁間的青藍溪水 */
        radial-gradient(ellipse 26% 72% at 52% 112%, rgba(31,107,132,.70) 0%, rgba(62,151,164,.59) 29%, rgba(131,201,192,.25) 64%, transparent 96%),
        radial-gradient(ellipse 13% 32% at 48% 84%, rgba(219,251,242,.35) 0%, transparent 100%),
        /* 左側山壁的常綠植被 */
        radial-gradient(ellipse 22% 46% at 7% 77%, rgba(34,105,75,.64) 0%, rgba(59,133,84,.39) 47%, transparent 98%),
        radial-gradient(ellipse 18% 30% at 16% 31%, rgba(62,124,87,.35) 0%, transparent 100%),
        /* 右側森林與岩壁邊緣 */
        radial-gradient(ellipse 26% 45% at 98% 71%, rgba(29,91,68,.64) 0%, rgba(63,130,88,.38) 52%, transparent 98%),
        radial-gradient(ellipse 18% 27% at 84% 19%, rgba(73,135,82,.37) 0%, transparent 100%),
        /* 灰藍色大理石山壁 — 色彩自然淡出，不再有斜直切面 */
        radial-gradient(ellipse 39% 104% at -12% 47%, rgba(62,81,89,.88) 0%, rgba(102,126,133,.81) 38%, rgba(163,188,191,.45) 70%, transparent 99%),
        radial-gradient(ellipse 42% 108% at 112% 43%, rgba(56,69,67,.88) 0%, rgba(92,108,102,.80) 40%, rgba(152,172,157,.42) 72%, transparent 99%),
        /* 峽谷上方透入的晨光 */
        radial-gradient(ellipse 46% 58% at 52% -3%, rgba(255,255,247,.91) 0%, rgba(235,248,244,.59) 38%, transparent 95%),
        linear-gradient(180deg, #bdd4dd 0%, #dcece8 33%, #bedad1 68%, #86b4a9 100%);
    }

    /* 右側溪谷的溫柔光感，像水面反射而不是切割出的色塊。 */
    .valley-scenery::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 18% 48% at 53% 108%, rgba(232,252,245,.38) 0%, rgba(170,224,213,.20) 41%, transparent 96%),
        radial-gradient(ellipse 12% 22% at 50% 67%, rgba(236,253,248,.24) 0%, transparent 100%),
        radial-gradient(ellipse 28% 27% at 50% 42%, rgba(247,253,250,.46) 0%, rgba(245,253,250,.16) 56%, transparent 100%);
      filter: blur(13px);
    }

    /* 山間霧光，降低卡片後方的對比，保留 Liquid Glass 的透景感。 */
    .valley-scenery::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 40% 44% at 53% 34%, rgba(250,255,252,.45) 0%, rgba(250,255,252,.16) 52%, transparent 100%),
        linear-gradient(180deg, rgba(255,255,255,.03) 0%, rgba(227,240,233,.02) 65%, rgba(212,233,224,.19) 100%);
      filter: blur(18px);
    }

    .glass-panel {
      background: var(--glass-background);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      box-shadow: var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.76),inset 0 -1px 0 rgba(255,255,255,.16);
      backdrop-filter: var(--glass-filter);
      -webkit-backdrop-filter: var(--glass-filter);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }
    .glass-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(123deg,rgba(255,255,255,.30),rgba(255,255,255,.035) 29%,transparent 62%);
      pointer-events: none;
      z-index: -1;
    }
    .glass-panel::after {
      content: "";
      position: absolute;
      left: 23px;
      right: 23px;
      top: 0;
      height: 1px;
      background: linear-gradient(90deg,transparent,rgba(255,255,255,.85) 38%,rgba(255,255,255,.3) 72%,transparent);
      pointer-events: none;
    }

    header {
      position: fixed;
      z-index: 1000;
      inset: 0 0 auto;
      min-height: var(--header-h);
      background: linear-gradient(115deg,rgba(13,42,38,.56),rgba(55,94,70,.38) 54%,rgba(18,58,46,.56));
      border-bottom: 1px solid rgba(238,255,245,.37);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12),0 4px 22px rgba(17,58,42,.15);
      backdrop-filter: blur(24px) saturate(154%);
      -webkit-backdrop-filter: blur(24px) saturate(154%);
    }
    .nav-container {
      width: 100%;
      max-width: 1120px;
      min-height: var(--header-h);
      margin: 0 auto;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .header-left,.header-center,.header-right { display: flex; align-items: center; flex: 1; }
    .header-left { justify-content: flex-start; gap: 25px; }
    .header-center { justify-content: center; }
    .header-right { justify-content: flex-end; gap: 25px; }
    .logo { display: flex; text-decoration: none; align-items: center; }
    .logo img { display: block; width: auto; max-height: 45px; max-width: 220px; }
    .site-logo-fallback { color: #eefcff; font-size: 21px; font-weight: 800; letter-spacing: 2px; text-align: center; line-height: 1.05; }
    .site-logo-fallback small { display:block; font-size: 7px; letter-spacing: 2px; margin-top: 4px; }
    header a,header button {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      color: #f8fdf5;
      text-decoration: none;
      transition: color .2s ease;
    }
    header a:hover,header button:hover { color: #E5FBA1; }
    .dropdown { position: relative; }
    .dropdown-btn {
      display: inline-block;
      padding: 10px 0;
      cursor: pointer;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      color: #f8fdf5;
      white-space: nowrap;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: -16px;
      min-width: 168px;
      padding: 8px 0;
      background: rgba(31,77,59,.89);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 1100;
    }
    .dropdown-content.show { display: block; }
    .dropdown-content a { display: block; padding: 11px 16px; text-align: center; font-size: 14px; }
    .dropdown-content a:hover { background: rgba(222,250,208,.16); }

    main {
      max-width: 1120px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 20px 10px;
      position: relative;
      z-index: 1;
    }
    .profile-section {
      display: grid;
      grid-template-columns: minmax(0,365px) minmax(0,1fr);
      gap: 26px;
      align-items: stretch;
      width: 100%;
      min-height: 0;
    }
    .left-column {
      display: grid;
      grid-template-rows: minmax(96px,21%) minmax(0,1fr);
      gap: 18px;
      min-width: 0;
      min-height: 0;
    }
    .name-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      min-height: 0;
      flex-direction: column;
      gap: 6px;

    .profile-logo-top { max-height: 100px; max-width: min(90%,230px); width: auto; height: auto; object-fit: contain; }
    .name-fallback { text-align: center; }
    .name-fallback h1 {
      margin: 0;
      font-size: clamp(37px,4.1vw,55px);
      color: #8aaf52;
      letter-spacing: 3px;
      line-height: 1.05;
      text-shadow: 0 1px 16px rgba(25,121,155,.20);
    }
    .name-fallback p { margin: 7px 0 0; color: rgba(65,119,86,.75); font-size: 11px; letter-spacing: 3px; font-weight: 750; }
    .portrait-card {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }
    .portrait-card img {
      display: block;
      width: auto;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
      filter: drop-shadow(0 8px 17px rgba(27,94,57,.17));
    }
    .portrait-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      color: #6fa27a;
      font-weight: 750;
      text-align: center;
    }
    .portrait-fallback .wheat-icon { font-size: clamp(72px,11vw,130px); opacity: .68; }
    .portrait-fallback p { font-size: 16px; margin: 0; }
    .profile-card { min-width: 0; min-height: 0; padding: 14px 32px; display: flex; }
    .char-table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; }
    .char-table tr { height: 10%; }
    .char-table td {
      padding: 3px 0;
      border-bottom: 1px solid rgba(82,137,106,.19);
      color: #283e35;
      font-weight: 650;
      line-height: 1.25;

    .char-table td:first-child { width: 118px; padding-right: 10px; color: #369866; font-weight: 850; }
    .char-table tr:last-child td { border-bottom: none; }
    .color-indicator { display: inline-flex; gap: 8px; align-items: center; }
    .color-dot { width: 16px; height: 16px; border-radius: 50%; background: #E5FBA1; border: 1px solid rgba(93,146,76,.26); box-shadow: 0 0 0 3px rgba(245,255,204,.48); }
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: rgba(34,81,58,.77);
      height: 42px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 14px;

    /* 跟岳嵐、穗蓉及高中生系列一致：桌面單一視窗看完立繪與角色卡。 */
    @media (min-width: 921px) and (min-height: 650px) {
      body { display: flex; flex-direction: column; }
      main { flex: 1; min-height: 0; display: flex; }
      .profile-section {
        width: 100%;
        height: calc(100vh - var(--header-h) - 18px - 10px - 42px);
        height: calc(100dvh - var(--header-h) - 18px - 10px - 42px);
      }
      .left-column, .profile-card { height: 100%; }
      footer { flex: 0 0 42px; }
    }
    @media (min-width: 921px) and (max-height: 649px) {
      .profile-section { min-height: 610px; }
      .left-column { grid-template-rows: 134px 1fr; }
    }
    @media (max-width: 920px) {
      .profile-section { grid-template-columns: 1fr; gap: 18px; }
      .left-column { grid-template-columns: minmax(0,.85fr) minmax(0,1.15fr); grid-template-rows: 260px; }
      .name-card,.portrait-card { min-height: 0; }
      .portrait-card img { max-height: 100%; width: auto; height: 100%; }
      .profile-card { min-height: 575px; }
      .char-table tr { height: auto; }
    }
    @media (max-width: 768px) {
      :root { --header-h: 128px; }
      .nav-container { flex-direction: column; justify-content: center; min-height: 128px; gap: 9px; padding: 10px 16px; }
      .header-left { display: none; }
      .header-center,.header-right { flex: none; width: 100%; justify-content: center; }
      .header-right { gap: 28px; }
      .header-right a,.dropdown-btn { font-size: 17px; }
      .dropdown-content { right: 50%; transform: translateX(50%); top: calc(100% + 5px); }
      .logo img { max-height: 45px; }
      main { padding: 16px 16px 8px; }
      .left-column { grid-template-columns: 1fr; grid-template-rows: 106px minmax(0,420px); gap: 14px; }
      .name-card { padding: 12px 18px; }
      .profile-logo-top { max-height: 84px; }
      .name-fallback h1 { font-size: 41px; }
      .name-fallback p { font-size: 10px; }
      .portrait-card { padding: 14px; }
      .portrait-card img { width: auto; height: 100%; max-height: 100%; }
      .profile-card { padding: 14px 22px; min-height: 0; }
      .char-table td { padding: 15px 0; font-size: 14.5px; }
      .char-table td:first-child { width: 103px; }
      footer { height: auto; min-height: 56px; padding: 14px 8px 20px; }
      /* iPhone 背景保底：山谷綠維持通透，不發生白底合成異常。 */
      .glass-panel { background: linear-gradient(130deg,rgba(244,253,247,.79),rgba(186,229,204,.64)); }
    }
    @media (max-width: 900px) {

      /* 手機版直接沿用同一張多層漸層景色，不再切出低多邊形岩壁。 */
      .valley-scenery {
        background:
          radial-gradient(ellipse 38% 70% at 52% 110%, rgba(27,109,132,.57) 0%, rgba(70,158,163,.41) 38%, transparent 95%),
          radial-gradient(ellipse 30% 47% at 4% 77%, rgba(39,113,75,.52) 0%, rgba(80,148,95,.28) 54%, transparent 100%),
          radial-gradient(ellipse 34% 43% at 98% 74%, rgba(38,105,76,.48) 0%, rgba(89,151,106,.24) 56%, transparent 100%),
          radial-gradient(ellipse 57% 104% at -27% 50%, rgba(65,85,95,.83) 0%, rgba(110,140,143,.61) 42%, transparent 100%),
          radial-gradient(ellipse 57% 110% at 126% 48%, rgba(63,81,75,.82) 0%, rgba(112,143,128,.58) 43%, transparent 100%),
          radial-gradient(ellipse 50% 50% at 53% 0%, rgba(255,255,248,.77) 0%, transparent 98%),
          linear-gradient(180deg, #cadfe1 0%, #dcece8 44%, #abcec2 100%);
      }
    }
    @media (max-width: 420px) {
      .left-column { grid-template-rows: 100px minmax(0,378px); }
      .profile-card { padding: 12px 18px; }
      .char-table td { font-size: 13.5px; padding: 14px 0; }
      .char-table td:first-child { width: 94px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
  </style>
</head>

  <script>
    // 導覽列：開關、點擊外側及 Escape，桌面與手機共用。
    (() => {
      const dropdown = document.querySelector('.dropdown');
      const button = dropdown.querySelector('.dropdown-btn');
      const menu = dropdown.querySelector('.dropdown-content');
      function setOpen(open) {
        menu.classList.toggle('show',open);
        button.setAttribute('aria-expanded',String(open));
      }
      button.addEventListener('click',event=>{
        event.stopPropagation();
        setOpen(!menu.classList.contains('show'));
      });
      document.addEventListener('click',event=>{
        if(!dropdown.contains(event.target)) setOpen(false);
      });
      document.addEventListener('keydown',event=>{
        if(event.key==='Escape') { setOpen(false); button.focus(); }
      });
    })();
  </script>
  <script>
    // 森嶼之聲・岳嵐：馬卡龍綠／嫩葉綠／柔白的五角星粒子拖尾。
    (() => {
      const canvas=document.getElementById('cursor-canvas');
      if(!canvas) return;
      const ctx=canvas.getContext('2d',{alpha:true});
      if(!ctx) return;
      const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
      const colors=['#F7FFE8','#E5FBA1','#D8F58F','#BDE888','#9DDEA6','#7BC59D'];
      const particles=[];
      let width=0,height=0,frame=0,lastSpawn=0;
      const maxParticles=200;
      function resize(){
        width=window.innerWidth;
        height=window.innerHeight;
        const dpr=Math.min(window.devicePixelRatio||1,2);
        canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
        ctx.setTransform(dpr,0,0,dpr,0,0);
      }
      window.addEventListener('resize',resize,{passive:true});resize();
      function drawStar(x,y,r,rotation){
        ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.beginPath();
        for(let i=0;i<10;i++){
          const angle=-Math.PI/2+i*Math.PI/5;
          const radius=i%2===0?r:r*.49;
          const px=Math.cos(angle)*radius,py=Math.sin(angle)*radius;
          if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();ctx.fill();ctx.restore();
      }
      function addStar(x,y){
        const angle=Math.random()*Math.PI*2,speed=Math.random()*1.25+.18;
        particles.push({
          x:x+(Math.random()-.5)*13,y:y+(Math.random()-.5)*13,
          vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-.38,
          size:Math.random()*5.8+4.6,color:colors[Math.floor(Math.random()*colors.length)],
          life:0,maxLife:Math.random()*30+36,rotation:Math.random()*Math.PI*2,
          rs:(Math.random()-.5)*.09
        });
        if(particles.length>maxParticles)particles.splice(0,particles.length-maxParticles);
        if(!frame)frame=requestAnimationFrame(animate);
      }
      function leaveTrail(x,y){
        if(document.hidden||reduceMotion.matches)return;
        const now=performance.now();if(now-lastSpawn<12)return;lastSpawn=now;
        addStar(x,y);addStar(x,y);
      }
      window.addEventListener('mousemove',e=>leaveTrail(e.clientX,e.clientY),{passive:true});
      window.addEventListener('touchmove',e=>{if(e.touches.length)leaveTrail(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
      function animate(){
        frame=0;ctx.clearRect(0,0,width,height);
        if(document.hidden||reduceMotion.matches){particles.length=0;return;}
        for(let i=particles.length-1;i>=0;i--){
          const p=particles[i];p.life++;
          if(p.life>=p.maxLife){particles.splice(i,1);continue;}
          p.x+=p.vx;p.y+=p.vy;p.vy+=.042;p.rotation+=p.rs;
          const alpha=1-p.life/p.maxLife;
          ctx.globalAlpha=Math.min(.94,alpha);
          ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=9;
          drawStar(p.x,p.y,p.size,p.rotation);
        }
        ctx.globalAlpha=1;ctx.shadowBlur=0;
        if(particles.length)frame=requestAnimationFrame(animate);
      }
      function reset(){
        if(frame)cancelAnimationFrame(frame);frame=0;
        particles.length=0;ctx.clearRect(0,0,width,height);
      }
      document.addEventListener('visibilitychange',()=>{if(document.hidden)reset();});
      reduceMotion.addEventListener?.('change',()=>{if(reduceMotion.matches)reset();});
    })();
  </script>
</body>
